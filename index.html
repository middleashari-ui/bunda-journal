<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>Bunda Journal - Jurnal Kehamilan Mindful</title>
    <meta name="description" content="Jurnal kehamilan digital estetik offline-first dengan daily habit tracker, galeri USG lokal, dan buku kenangan cetak hardcover linen." />
    <meta property="og:title" content="Bunda Journal - Jurnal Kehamilan Mindful" />
    <meta property="og:description" content="Abadikan perjalanan 9 bulan yang magis dalam jurnal estetik tersimpan aman di perangkat Anda." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5A6E4A" />
    <meta name="application-name" content="Bunda Journal" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bunda Journal" />
    <link rel="icon" type="image/png" href="/icon-192-v2.png" />
    <link rel="apple-touch-icon" href="/icon-192-v2.png" />

    <!-- Google Fonts: Inter (UI) & Lora (Jurnal) -->

    <!-- Midtrans Snap JS (env-driven: .env = sandbox, .env.production = production) -->
    <script
      src="%VITE_MIDTRANS_SNAP_URL%"
      data-client-key="%VITE_MIDTRANS_CLIENT_KEY%"
    ></script>
  </head>
  <body class="bg-[#FAF6EE] text-[#292524] antialiased selection:bg-[#C87A64]/20 selection:text-[#C87A64]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
