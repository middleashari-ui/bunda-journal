<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bunda Journal - Jurnal Kehamilan Kinfolk</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            oatmeal: '#F9F8F6',
            appBg: '#F5F2EB',
            sage: '#556B2F',
            sageLight: '#708846',
            terracotta: '#C87A64',
            terracottaSoft: '#F4ECE8',
            stoneDark: '#292524',
            stoneMuted: '#78716C',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 8px 30px rgba(0,0,0,0.04)',
            'card': '0 4px 20px rgba(74, 58, 51, 0.05)',
            'lift': '0 12px 36px rgba(85, 107, 47, 0.12)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #ECE8E1;
      font-family: 'Inter', sans-serif;
      color: #292524;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    /* Hide scrollbars for clean aesthetic */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 bg-[#EBE7DF]">
  <div id="root" class="w-full max-w-[430px] min-h-screen md:min-h-[880px] bg-[#F5F2EB] shadow-2xl relative flex flex-col overflow-hidden md:rounded-[40px] md:border-[8px] md:border-[#2C2927]"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICON HELPER COMPONENT (Lucide / Material Symbols equivalent) ---
    function Icon({ name, className = "text-xl", filled = false }) {
      return (
        <span 
          className={`material-symbols-outlined select-none inline-flex items-center justify-center ${className}`}
          style={{ fontVariationSettings: filled ? "'FILL' 1, 'wght' 400" : "'FILL' 0, 'wght' 350" }}
        >
          {name}
        </span>
      );
    }

    // --- MAIN APP CONTAINER ---
    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeTab, setActiveTab] = useState('home'); // 'home', 'jurnal', 'katalog', 'profil'
      
      // Shared App State
      const [week, setWeek] = useState(12);
      const [journalText, setJournalText] = useState('Hari ini detak jantungmu terdengar begitu jelas saat kontrol dokter. Bahagia dan haru sekali, nak...');
      const [journalSaved, setJournalSaved] = useState(true);
      const [habits, setHabits] = useState({
        water: true,
        vitamins: true,
        walk: false,
        sleep: true,
      });
      const [selectedMood, setSelectedMood] = useState(2); // 0 to 4
      const [notificationsEnabled, setNotificationsEnabled] = useState(true);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncSuccess, setSyncSuccess] = useState(false);
      const [photos, setPhotos] = useState([
        { id: 1, caption: 'USG Trimester 1 (12W)', date: '12 Okt 2024', src: 'https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=400&q=80' },
        { id: 2, caption: 'Baby Bump Pertama', date: '08 Okt 2024', src: 'https://images.unsplash.com/photo-1544126592-807ade215a0b?auto=format&fit=crop&w=400&q=80' }
      ]);
      const [showCheckoutToast, setShowCheckoutToast] = useState(false);

      const toggleHabit = (key) => {
        setHabits(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const handleBuyNow = () => {
        setIsLoggedIn(true);
        setActiveTab('home');
      };

      const handleAddPhoto = () => {
        const dummyPhotos = [
          'https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=400&q=80',
          'https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=400&q=80',
          'https://images.unsplash.com/photo-1555252333-9f8e92e65df9?auto=format&fit=crop&w=400&q=80'
        ];
        const randomPic = dummyPhotos[Math.floor(Math.random() * dummyPhotos.length)];
        const newPhoto = {
          id: Date.now(),
          caption: `Momen Manis W${week}`,
          date: 'Baru saja',
          src: randomPic
        };
        setPhotos([newPhoto, ...photos]);
      };

      const triggerGoogleDriveSync = () => {
        setIsSyncing(true);
        setTimeout(() => {
          setIsSyncing(false);
          setSyncSuccess(true);
          setTimeout(() => setSyncSuccess(false), 3000);
        }, 1200);
      };

      // RENDER: Landing Page vs Main App
      if (!isLoggedIn) {
        return <LandingPage onBuyNow={handleBuyNow} />;
      }

      return (
        <div className="flex flex-col h-full min-h-screen bg-[#F5F2EB] text-[#292524] relative pb-20 select-none">
          {/* Top Notch Simulator for Desktop View */}
          <div className="hidden md:flex justify-between items-center px-7 pt-3 text-[12px] font-medium text-stone-500">
            <span>9:41</span>
            <div className="w-20 h-4 bg-stone-800 rounded-full mx-auto"></div>
            <div className="flex items-center gap-1.5">
              <Icon name="signal_cellular_alt" className="text-sm" />
              <Icon name="wifi" className="text-sm" />
              <Icon name="battery_full" className="text-sm" />
            </div>
          </div>

          {/* App Header */}
          <header className="px-5 pt-4 pb-2.5 flex items-center justify-between border-b border-stone-200/50 bg-[#F5F2EB]/95 backdrop-blur-md sticky top-0 z-30">
            <div className="flex items-center gap-2">
              <span className="font-serif text-2xl font-bold tracking-tight text-[#292524]">bunda.</span>
              <span className="text-[10px] uppercase tracking-widest px-2 py-0.5 bg-[#556B2F]/15 text-[#556B2F] font-semibold rounded-full">Boho Edition</span>
            </div>
            <div className="flex items-center gap-2">
              <button 
                onClick={() => setIsLoggedIn(false)} 
                title="Keluar ke Landing Page" 
                className="text-xs text-stone-500 hover:text-stone-800 flex items-center gap-1 bg-stone-200/60 px-2.5 py-1 rounded-full transition-all"
              >
                <Icon name="logout" className="text-sm" />
                <span>Demo Exit</span>
              </button>
            </div>
          </header>

          {/* Main Tab Content */}
          <main className="flex-1 overflow-y-auto no-scrollbar">
            {activeTab === 'home' && (
              <TabHome 
                week={week} 
                habits={habits} 
                toggleHabit={toggleHabit} 
                onGoToJournal={() => setActiveTab('jurnal')} 
                onGoToKatalog={() => setActiveTab('katalog')} 
              />
            )}
            {activeTab === 'jurnal' && (
              <TabJurnal 
                week={week} 
                setWeek={setWeek} 
                journalText={journalText} 
                setJournalText={setJournalText} 
                journalSaved={journalSaved} 
                setJournalSaved={setJournalSaved} 
                habits={habits} 
                toggleHabit={toggleHabit} 
                selectedMood={selectedMood} 
                setSelectedMood={setSelectedMood} 
                photos={photos} 
                onAddPhoto={handleAddPhoto} 
              />
            )}
            {activeTab === 'katalog' && (
              <TabKatalog 
                onOrderClick={() => {
                  setShowCheckoutToast(true);
                  setTimeout(() => setShowCheckoutToast(false), 3500);
                }} 
              />
            )}
            {activeTab === 'profil' && (
              <TabProfil 
                notificationsEnabled={notificationsEnabled}
                setNotificationsEnabled={setNotificationsEnabled}
                isSyncing={isSyncing}
                syncSuccess={syncSuccess}
                onSync={triggerGoogleDriveSync}
                onLogout={() => setIsLoggedIn(false)}
              />
            )}
          </main>

          {/* Order Toast */}
          {showCheckoutToast && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 w-[90%] max-w-[390px] bg-[#292524] text-white p-3.5 rounded-2xl shadow-xl flex items-center justify-between text-xs z-50 animate-bounce">
              <div className="flex items-center gap-2.5">
                <Icon name="check_circle" className="text-[#C87A64] text-xl" filled />
                <span>Pesanan Buku Cetak sedang dipersiapkan!</span>
              </div>
              <span className="font-bold text-[#E59882]">Rp 249.000</span>
            </div>
          )}

          {/* Fixed Bottom Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-[#F9F8F6]/95 backdrop-blur-md border-t border-stone-200/80 px-4 py-2 flex justify-around items-center z-40 md:rounded-b-[32px]">
            <button 
              onClick={() => setActiveTab('home')} 
              className={`flex flex-col items-center py-1 px-3 transition-colors ${activeTab === 'home' ? 'text-[#C87A64] font-semibold' : 'text-stone-400 hover:text-stone-600'}`}
            >
              <Icon name="home" className="text-2xl" filled={activeTab === 'home'} />
              <span className="text-[11px] mt-0.5">Home</span>
            </button>

            <button 
              onClick={() => setActiveTab('jurnal')} 
              className={`flex flex-col items-center py-1 px-3 transition-colors ${activeTab === 'jurnal' ? 'text-[#C87A64] font-semibold' : 'text-stone-400 hover:text-stone-600'}`}
            >
              <Icon name="edit_note" className="text-2xl" filled={activeTab === 'jurnal'} />
              <span className="text-[11px] mt-0.5">Jurnal</span>
            </button>

            <button 
              onClick={() => setActiveTab('katalog')} 
              className={`flex flex-col items-center py-1 px-3 transition-colors ${activeTab === 'katalog' ? 'text-[#C87A64] font-semibold' : 'text-stone-400 hover:text-stone-600'}`}
            >
              <Icon name="menu_book" className="text-2xl" filled={activeTab === 'katalog'} />
              <span className="text-[11px] mt-0.5">Katalog</span>
            </button>

            <button 
              onClick={() => setActiveTab('profil')} 
              className={`flex flex-col items-center py-1 px-3 transition-colors ${activeTab === 'profil' ? 'text-[#C87A64] font-semibold' : 'text-stone-400 hover:text-stone-600'}`}
            >
              <Icon name="person" className="text-2xl" filled={activeTab === 'profil'} />
              <span className="text-[11px] mt-0.5">Profil</span>
            </button>
          </nav>
        </div>
      );
    }

    // ==========================================
    // PART 1: LANDING PAGE (Modern Scandi)
    // ==========================================
    function LandingPage({ onBuyNow }) {
      return (
        <div className="flex flex-col min-h-screen bg-[#F9F8F6] text-[#292524] overflow-y-auto no-scrollbar pb-10">
          {/* Top Bar */}
          <nav className="p-6 flex items-center justify-between">
            <span className="font-serif text-3xl font-bold tracking-tight text-[#292524]">bunda.</span>
            <div className="flex items-center gap-2">
              <span className="text-xs bg-[#556B2F]/10 text-[#556B2F] font-semibold px-3 py-1 rounded-full">
                Kinfolk Edition
              </span>
            </div>
          </nav>

          {/* Hero Section */}
          <section className="px-6 pt-2 pb-6 text-center">
            <div className="inline-flex items-center gap-1.5 px-3 py-1 bg-stone-200/60 rounded-full text-[11px] font-medium text-stone-700 mb-4">
              <Icon name="spa" className="text-sm text-[#556B2F]" filled />
              <span>Jurnal Kehamilan Offline-First & Buku Kenangan</span>
            </div>

            <h1 className="font-serif text-3xl sm:text-4xl leading-[1.25] text-[#292524] font-bold mb-3">
              Abadikan Perjalanan <br />
              <span className="italic text-[#C87A64]">9 Bulan yang Magis.</span>
            </h1>

            <p className="text-sm text-stone-600 max-w-sm mx-auto leading-relaxed mb-6 font-light">
              Jurnal digital estetik yang tersimpan aman di perangkat Anda tanpa kuota, dengan opsi sekali-klik cetak buku kenangan hardcover bersampul kain linen.
            </p>

            {/* Mockup / Visual Card */}
            <div className="relative mx-auto max-w-[320px] bg-white rounded-3xl p-4 shadow-card border border-stone-200/50 mb-7">
              <div className="flex items-center justify-between mb-3 border-b border-stone-100 pb-2">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-[#C87A64]/15 flex items-center justify-center text-[#C87A64]">
                    <Icon name="favorite" className="text-sm" filled />
                  </div>
                  <div className="text-left">
                    <p className="text-[11px] font-bold text-stone-850">Minggu ke-12</p>
                    <p className="text-[9px] text-stone-400">Si kecil seukuran Buah Lemon 🍋</p>
                  </div>
                </div>
                <span className="text-[10px] text-[#556B2F] font-semibold bg-[#556B2F]/10 px-2 py-0.5 rounded-full">Trimester 1</span>
              </div>
              <div className="h-28 rounded-2xl bg-[#F5F2EB] flex flex-col items-center justify-center text-center p-3">
                <span className="text-3xl mb-1">🍋</span>
                <p className="font-serif italic text-xs text-stone-700">"Wajah manismu mulai terbentuk anggun dalam keheningan rahim bunda..."</p>
              </div>
              <div className="mt-3 flex items-center justify-between text-[11px] text-stone-500 pt-2 border-t border-stone-100">
                <span>💧 Air 2L Terpenuhi</span>
                <span>💊 Vitamin Rutin</span>
                <span className="text-[#C87A64] font-semibold">Tersimpan</span>
              </div>
            </div>

            {/* CTA Button */}
            <div className="max-w-xs mx-auto">
              <button 
                onClick={onBuyNow} 
                className="w-full py-4 px-6 rounded-full bg-[#556B2F] text-white font-medium text-sm tracking-wide shadow-lift hover:bg-[#465926] active:scale-98 transition-all flex items-center justify-center gap-2 group"
              >
                <span>Miliki Sekarang - Rp 49.000</span>
                <Icon name="arrow_forward" className="text-lg group-hover:translate-x-1 transition-transform" />
              </button>
              <p className="text-[11px] text-stone-500 mt-2">Sekali bayar seumur hidup • Akses instan langsung pakai</p>
            </div>
          </section>

          {/* 3 Features Elegant Grid */}
          <section className="px-6 py-6 border-t border-stone-200/60 bg-[#FAF9F7]">
            <h2 className="font-serif text-xl text-center font-semibold mb-5 text-stone-800">
              Dirancang Penuh Cinta untuk Bunda
            </h2>

            <div className="space-y-3.5">
              {/* Feature 1 */}
              <div className="p-4 bg-white rounded-2xl border border-stone-200/50 shadow-soft flex items-start gap-3.5">
                <div className="w-10 h-10 rounded-xl bg-[#556B2F]/10 flex items-center justify-center text-[#556B2F] shrink-0 mt-0.5">
                  <Icon name="water_drop" className="text-xl" filled />
                </div>
                <div>
                  <h3 className="font-serif text-sm font-bold text-stone-800 mb-0.5">Daily Habit & Mood Tracker</h3>
                  <p className="text-xs text-stone-500 leading-relaxed font-light">
                    Pantau asupan air 2L, asam folat, jalan santai, hingga suasana hati dengan sentuhan lembut setiap pagi.
                  </p>
                </div>
              </div>

              {/* Feature 2 */}
              <div className="p-4 bg-white rounded-2xl border border-stone-200/50 shadow-soft flex items-start gap-3.5">
                <div className="w-10 h-10 rounded-xl bg-[#C87A64]/10 flex items-center justify-center text-[#C87A64] shrink-0 mt-0.5">
                  <Icon name="shield" className="text-xl" filled />
                </div>
                <div>
                  <h3 className="font-serif text-sm font-bold text-stone-800 mb-0.5">100% Privat & Tanpa Kuota</h3>
                  <p className="text-xs text-stone-500 leading-relaxed font-light">
                    Arsitektur Local-First menyimpan foto perut dan USG langsung di memori HP Anda. Bebas buka di mana saja.
                  </p>
                </div>
              </div>

              {/* Feature 3 */}
              <div className="p-4 bg-white rounded-2xl border border-stone-200/50 shadow-soft flex items-start gap-3.5">
                <div className="w-10 h-10 rounded-xl bg-stone-100 flex items-center justify-center text-stone-700 shrink-0 mt-0.5">
                  <Icon name="auto_stories" className="text-xl" />
                </div>
                <div>
                  <h3 className="font-serif text-sm font-bold text-stone-800 mb-0.5">Eksport Buku Cetak Linen</h3>
                  <p className="text-xs text-stone-500 leading-relaxed font-light">
                    Saat si kecil lahir, seluruh riwayat tulisan dan fotomu dapat dicetak menjadi buku kenangan fisik berkualitas museum.
                  </p>
                </div>
              </div>
            </div>

            {/* Bottom Quick Trigger */}
            <div className="mt-8 text-center">
              <button 
                onClick={onBuyNow}
                className="text-xs font-semibold text-[#556B2F] underline underline-offset-4 hover:text-[#465926]"
              >
                Sudah punya akses? Buka Jurnal Saya &rarr;
              </button>
            </div>
          </section>
        </div>
      );
    }

    // ==========================================
    // TAB 1: HOME
    // ==========================================
    function TabHome({ week, habits, toggleHabit, onGoToJournal, onGoToKatalog }) {
      return (
        <div className="px-5 py-4 space-y-4">
          {/* Greeting Banner */}
          <div className="bg-white/80 backdrop-blur-sm p-4 rounded-3xl border border-stone-200/60 shadow-soft">
            <span className="text-[11px] uppercase tracking-wider font-semibold text-[#556B2F]">Trimester 1 • Hari 84</span>
            <h2 className="font-serif text-xl font-bold text-stone-850 mt-1 leading-snug">
              Halo Bunda, selamat datang di Minggu ke-{week}!
            </h2>
            <p className="text-xs text-stone-500 mt-1 font-light">
              Tubuh Bunda sedang bekerja luar biasa merajut organ-organ kecil buah hati tersayang.
            </p>
          </div>

          {/* Growth Card */}
          <div className="bg-[#FAF8F5] p-5 rounded-3xl border border-stone-200/60 shadow-soft relative overflow-hidden text-center">
            <div className="w-28 h-28 mx-auto rounded-full bg-gradient-to-tr from-[#FFF3D6] to-[#FFE79A] border-4 border-white shadow-card flex items-center justify-center relative mb-3">
              <span className="text-5xl animate-pulse">🍋</span>
              <span className="absolute bottom-0 right-0 p-1.5 bg-[#556B2F] text-white rounded-full text-xs">
                <Icon name="check" className="text-xs" />
              </span>
            </div>

            <h3 className="font-serif text-lg font-bold text-stone-800">
              Si Kecil seukuran Buah Lemon 🍋
            </h3>
            <p className="text-xs text-stone-600 mt-1 max-w-[260px] mx-auto font-light leading-relaxed">
              Panjangnya sekitar <strong>5.4 cm</strong> dengan berat <strong>~14 gram</strong>. Refleks jemari tangannya sudah mulai belajar menggenggam.
            </p>

            <div className="mt-4 pt-3 border-t border-stone-200/60 flex justify-center gap-6 text-xs text-stone-600">
              <div>
                <span className="block text-[10px] text-stone-400 uppercase tracking-wider">Detak Jantung</span>
                <span className="font-serif font-bold text-stone-800 text-sm">155 bpm</span>
              </div>
              <div className="w-px bg-stone-200"></div>
              <div>
                <span className="block text-[10px] text-stone-400 uppercase tracking-wider">Sisa Waktu</span>
                <span className="font-serif font-bold text-stone-800 text-sm">196 Hari</span>
              </div>
            </div>
          </div>

          {/* Quick Habits Widget */}
          <div className="bg-white p-4 rounded-3xl border border-stone-200/60 shadow-soft">
            <div className="flex items-center justify-between mb-3">
              <h4 className="font-serif text-sm font-bold text-stone-800">Kebiasaan Sehat Hari Ini</h4>
              <span className="text-[11px] text-[#556B2F] font-semibold">
                {Object.values(habits).filter(Boolean).length} / 4 Selesai
              </span>
            </div>

            <div className="grid grid-cols-2 gap-2">
              <button 
                onClick={() => toggleHabit('water')}
                className={`flex items-center gap-2 p-2.5 rounded-2xl text-xs font-medium transition-all text-left ${habits.water ? 'bg-[#556B2F] text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}
              >
                <Icon name="water_drop" className="text-base" filled={habits.water} />
                <span>💧 Air 2 Liter</span>
              </button>

              <button 
                onClick={() => toggleHabit('vitamins')}
                className={`flex items-center gap-2 p-2.5 rounded-2xl text-xs font-medium transition-all text-left ${habits.vitamins ? 'bg-[#556B2F] text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}
              >
                <Icon name="medication" className="text-base" filled={habits.vitamins} />
                <span>💊 Vitamin Rutin</span>
              </button>

              <button 
                onClick={() => toggleHabit('walk')}
                className={`flex items-center gap-2 p-2.5 rounded-2xl text-xs font-medium transition-all text-left ${habits.walk ? 'bg-[#556B2F] text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}
              >
                <Icon name="directions_walk" className="text-base" filled={habits.walk} />
                <span>🚶‍♀️ Jalan Santai</span>
              </button>

              <button 
                onClick={() => toggleHabit('sleep')}
                className={`flex items-center gap-2 p-2.5 rounded-2xl text-xs font-medium transition-all text-left ${habits.sleep ? 'bg-[#556B2F] text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}
              >
                <Icon name="bedtime" className="text-base" filled={habits.sleep} />
                <span>🛌 Tidur 8 Jam</span>
              </button>
            </div>
          </div>

          {/* Quick Access Card */}
          <div className="bg-gradient-to-r from-[#C87A64]/10 to-[#F5E6E0] p-4 rounded-3xl border border-[#C87A64]/20 flex items-center justify-between">
            <div>
              <p className="font-serif text-sm font-bold text-stone-850">Ingin menulis surat cinta?</p>
              <p className="text-xs text-stone-600 font-light">Tuliskan momen hari ini untuk si kecil.</p>
            </div>
            <button
