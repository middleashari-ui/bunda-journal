<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunda Journal - Mode Offline</title>
  <style>
    :root {
      --sage: #556B2F;
      --sage-dark: #465926;
      --sand: #FAF8F5;
      --text: #292524;
      --text-muted: #78716c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--sand);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    .icon {
      width: 56px;
      height: 56px;
      background-color: #f4f6f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      color: var(--sage);
      font-size: 24px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }
    p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 20px;
      background-color: var(--sage);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: var(--sage-dark);
    }
    .btn-secondary {
      background-color: #f5f5f4;
      color: var(--text);
      margin-top: 10px;
      border: 1px solid #e7e5e4;
    }
    .btn-secondary:hover {
      background-color: #e7e5e4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌿</div>
    <h1>Nyalakan Internet Sekali Saja</h1>
    <p>Buka Bunda Journal sekali saat ada sinyal internet agar seluruh aplikasi tersimpan di HP Bunda. Setelah itu, Bunda bisa bebas menulis jurnal kapan saja tanpa kuota.</p>
    <a href="/" class="btn" id="btn-buka-aplikasi">Buka Aplikasi</a>
    <button onclick="window.location.reload()" class="btn btn-secondary" id="btn-coba-lagi">Coba Lagi</button>
  </div>
</body>
</html>
